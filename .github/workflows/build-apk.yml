name: Build MediaShield Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and test Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Run pure-Java core tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/jvm-test
          javac --add-modules jdk.httpserver -d build/jvm-test \
            app/src/main/java/com/example/bravemediasaver/HlsPlaylist.java \
            app/src/main/java/com/example/bravemediasaver/HostMatcher.java \
            app/src/main/java/com/example/bravemediasaver/RangePlanner.java \
            app/src/main/java/com/example/bravemediasaver/ParallelRangeDownloader.java \
            tests/*.java
          for test in HostMatcherTest HlsPlaylistTest RangePlannerTest ParallelRangeDownloaderTest; do
            java --add-modules jdk.httpserver -cp build/jvm-test "com.example.bravemediasaver.${test}"
          done

      - name: Security policy checks (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          store=Path("app/src/main/java/com/example/bravemediasaver/TaskStore.java").read_text()
          service=Path("app/src/main/java/com/example/bravemediasaver/DownloadService.java").read_text()
          web=Path("app/src/main/java/com/example/bravemediasaver/MainActivity.java").read_text()
          inspector=Path("app/src/main/java/com/example/bravemediasaver/HlsInspector.java").read_text()
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android:allowBackup="false"' in manifest
          assert 'android:exported="false"' in manifest
          assert "android.permission.REQUEST_INSTALL_PACKAGES" not in manifest
          assert "android.permission.QUERY_ALL_PACKAGES" not in manifest
          assert "android.permission.MANAGE_EXTERNAL_STORAGE" not in manifest
          assert 't.put("cookie","")' in store
          assert 'if (sanitized)' in store
          assert 'task.put("cookie", "")' in store
          assert "validDownloadUrl" in store
          assert "MIXED_CONTENT_NEVER_ALLOW" in web
          assert "setAllowUniversalAccessFromFileURLs(false)" in web
          assert "onReceivedSslError" in web and "h.cancel()" in web
          assert "setInstanceFollowRedirects(true)" not in service
          assert "setInstanceFollowRedirects(false)" in inspector
          print("Static security policy checks passed (not malware certification)")
          PY

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Record APK SHA-256 checksum
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          ls -lh app-debug.apk app-debug.apk.sha256

      - name: Publish APK (download under Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MediaShieldBrowser-Android-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
