name: Build personally signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal-release:
    name: Personal signing (requires private secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Confirm personal signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.MEDIASHIELD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MEDIASHIELD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MEDIASHIELD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Personal signing secrets are missing. See PERSONAL_RELEASE.md."
            exit 1
          fi

      - name: Decode signing key in runner temporary directory
        env:
          KEYSTORE_B64: ${{ secrets.MEDIASHIELD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/mediashield-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "MEDIASHIELD_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build personal release APK
        env:
          MEDIASHIELD_KEY_ALIAS: ${{ secrets.MEDIASHIELD_KEY_ALIAS }}
          MEDIASHIELD_STORE_PASSWORD: ${{ secrets.MEDIASHIELD_STORE_PASSWORD }}
          MEDIASHIELD_KEY_PASSWORD: ${{ secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease

      - name: Verify release signature and package permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "Signature verified. This is NOT a Google Play Protect certification."

      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mediashield-signing.jks"

      - name: Upload personal APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaShield-Personal-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 7
          if-no-files-found: error
