name: First-time personal key and APK (phone only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to create one-time key; do not repeat unless you want a different identity'
        required: true
        type: string

permissions:
  contents: read

jobs:
  personal-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ inputs.confirm == 'GENERATE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate user-owned secrets
        env:
          STORE_PASS: ${{ secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
          BACKUP_PASS: ${{ secrets.MEDIASHIELD_BACKUP_PASSPHRASE || secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${#STORE_PASS}" -lt 16 ]; then
            echo "::error::Missing or too-short signing secret. Set MEDIASHIELD_STORE_PASSWORD (16+ chars); existing MEDIASHIELD_KEY_PASSWORD can also be used."
            exit 1
          fi
          if [ "${#BACKUP_PASS}" -lt 16 ]; then
            echo "::error::Missing or too-short backup encryption secret. Set MEDIASHIELD_BACKUP_PASSPHRASE (recommended 20+ chars), or use the existing signing secret fallback."
            exit 1
          fi
          echo "Secrets are present and satisfy the minimum length checks (contents never printed)."
          if [ "${#BACKUP_PASS}" -lt 20 ]; then
            echo "::warning::For long-term key backups, use a separate MEDIASHIELD_BACKUP_PASSPHRASE of at least 20 chars."
          fi

      - name: Generate a local PKCS12 signing key (only once)
        env:
          STORE_PASS: ${{ secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/personal-signing.p12"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype PKCS12             -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias mediashield-personal             -keyalg RSA -keysize 3072 -validity 10000             -dname 'CN=MediaShield Personal, OU=Personal, O=Private, C=KR'
          echo "MEDIASHIELD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build and verify the personally signed APK
        env:
          MEDIASHIELD_KEY_ALIAS: mediashield-personal
          MEDIASHIELD_STORE_PASSWORD: ${{ secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
          MEDIASHIELD_KEY_PASSWORD: ${{ secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "Not Play Protect approved; this build remains for review only."

      - name: Encrypt the private key backup separately
        env:
          BACKUP_PASS: ${{ secrets.MEDIASHIELD_BACKUP_PASSPHRASE || secrets.MEDIASHIELD_STORE_PASSWORD || secrets.MEDIASHIELD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/backup"
          # The plaintext keystore never enters an artifact or the repository.
          printf '%s' "$BACKUP_PASS" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 300000             -in "$MEDIASHIELD_KEYSTORE_FILE"             -out "$RUNNER_TEMP/backup/mediashield-personal.p12.enc" -pass stdin
          test -s "$RUNNER_TEMP/backup/mediashield-personal.p12.enc"
          cat > "$RUNNER_TEMP/backup/READ_ME.txt" <<'EON'
          KEEP THIS BACKUP: mediashield-personal.p12.enc
          It is encrypted with MEDIASHIELD_BACKUP_PASSPHRASE when provided, otherwise with your signing password. Preserve the exact password.
          Your signing keystore is separately protected by MEDIASHIELD_STORE_PASSWORD.
          Losing either password or this file prevents use of the same key for updates.
          Do not upload plaintext or decrypted keys to a public GitHub repository.
          Never disable Google Play Protect to install the APK.
          EON
          cp "$RUNNER_TEMP/backup/mediashield-personal.p12.enc" "$RUNNER_TEMP/backup/backup-copy.enc"
          sha256sum "$RUNNER_TEMP/backup/mediashield-personal.p12.enc" > "$RUNNER_TEMP/backup/backup.sha256"

      - name: Upload encrypted signing backup (save it to your phone)
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-Encrypted-Personal-Key-Backup
          path: ${{ runner.temp }}/backup/
          retention-days: 7
          if-no-files-found: error

      - name: Upload signed APK for external security review
        uses: actions/upload-artifact@v4
        with:
          name: Personal-APK-REVIEW-NOT-VERIFIED
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Delete unencrypted key after workflow completes
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/personal-signing.p12"
